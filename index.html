<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Domain For Sale</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f9fafb, #edf2f7);
      margin: 0;
      padding: 0;
      color: #2d3748;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 40px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
      margin-bottom: 32px;
      color: #4a5568;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    input, textarea, button {
      font-size: 16px;
      padding: 12px 16px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2c5282;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #a0aec0;
      text-align: center;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 24px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>This Domain is For Sale</h1>
    <p>Interested in purchasing this premium domain? Leave your details and offer below. We'll get back to you shortly.</p>

    <form action="https://formsubmit.co/creativision.com" method="POST">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="tel" name="mail" placeholder="your email" required />
      <input type="text" name="offer" placeholder="Your Offer (e.g. $500)" required />
      <button type="submit">Send Offer</button>
    </form>
  </div>

  <footer>&copy; 2025 Domain Owner</footer>
</body>
</html>
